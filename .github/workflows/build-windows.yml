name: Build StudentITCenter for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Download JavaFX Windows SDK
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://download2.gluonhq.com/openjfx/23.0.1/openjfx-23.0.1_windows-x64_bin-sdk.zip" `
            -OutFile javafx.zip

          Expand-Archive javafx.zip .

          Rename-Item `
            "javafx-sdk-23.0.1" `
            "javafx"

      - name: Compile
        shell: powershell
        run: |

          New-Item -ItemType Directory -Force out | Out-Null

          $sources = Get-ChildItem src -Recurse -Filter *.java |
            ForEach-Object { $_.FullName }

          javac `
            --module-path "javafx\lib" `
            --add-modules javafx.controls,javafx.fxml `
            -cp "lib\*" `
            -d out `
            $sources

      - name: Copy resources
        shell: powershell
        run: |

          Copy-Item src\style.css out\style.css

          if (Test-Path src\sample\sample.fxml) {
            New-Item -ItemType Directory -Force out\sample | Out-Null
            Copy-Item src\sample\sample.fxml out\sample\sample.fxml
          }

      - name: Create JAR
        shell: powershell
        run: |

          New-Item -ItemType Directory -Force package | Out-Null

          jar --create `
            --file package\StudentITCenter.jar `
            --main-class sample.Main `
            -C out .

      - name: Create Windows App Image
        shell: powershell
        run: |

          New-Item -ItemType Directory -Force dist | Out-Null

          jpackage `
            --type app-image `
            --name StudentITCenter `
            --input package `
            --main-jar StudentITCenter.jar `
            --main-class sample.Main `
            --module-path "javafx\lib" `
            --add-modules javafx.controls,javafx.fxml `
            --dest dist `
            --app-version 1.0.0 `
            --java-options "-Dprism.order=sw" `
            --java-options "-Dprism.verbose=true"

      - name: Copy dependencies into application
        shell: powershell
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            "dist\StudentITCenter\app\lib" | Out-Null

          Copy-Item `
            lib\*.jar `
            "dist\StudentITCenter\app\lib\"

      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: StudentITCenter-Windows-App
          path: dist\StudentITCenter
