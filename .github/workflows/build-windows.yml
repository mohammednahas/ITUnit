name: Build StudentITCenter for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:

      # 1. Get the project
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Install Java 23
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'


      # 3. Download JavaFX Windows SDK
      - name: Download JavaFX
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://download2.gluonhq.com/openjfx/23.0.1/openjfx-23.0.1_windows-x64_bin-sdk.zip" `
            -OutFile javafx.zip

          Expand-Archive javafx.zip -DestinationPath .

          Rename-Item `
            "javafx-sdk-23.0.1" `
            "javafx"


      # 4. Compile the application
      - name: Compile
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force out | Out-Null

          $sources = Get-ChildItem src -Recurse -Filter *.java |
            ForEach-Object { $_.FullName }

          javac `
            --module-path "javafx\lib" `
            --add-modules javafx.controls,javafx.fxml `
            -cp "lib\*" `
            -d out `
            $sources


      # 5. Copy application resources
      - name: Copy resources
        shell: powershell
        run: |
          Copy-Item src\style.css out\style.css

          if (Test-Path src\sample\sample.fxml) {
            New-Item -ItemType Directory -Force out\sample | Out-Null
            Copy-Item src\sample\sample.fxml out\sample\sample.fxml
          }


      # 6. Create application JAR
      - name: Create JAR
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null

          jar --create `
            --file package\StudentITCenter.jar `
            --main-class sample.Main `
            -C out .


      # 7. Put Apache POI dependencies beside the JAR
      - name: Prepare dependencies
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package\lib | Out-Null

          Copy-Item lib\*.jar package\lib\


      # 8. Build Windows application image
      - name: Create Windows Application
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          jpackage `
            --type app-image `
            --name StudentITCenter `
            --input package `
            --main-jar StudentITCenter.jar `
            --main-class sample.Main `
            --module-path "javafx\lib" `
            --add-modules javafx.controls,javafx.fxml `
            --dest dist `
            --app-version 1.0.0 `
            --java-options "-Dprism.order=sw"


      # 9. Verify generated package
      - name: Inspect package
        shell: powershell
        run: |
          Write-Host "===== APPLICATION ====="
          Get-ChildItem dist\StudentITCenter\app -Recurse

          Write-Host "===== RUNTIME ====="
          Get-ChildItem dist\StudentITCenter\runtime -Recurse -Depth 2


      # 10. Upload Windows application
      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: StudentITCenter-Windows-App
          path: dist\StudentITCenter